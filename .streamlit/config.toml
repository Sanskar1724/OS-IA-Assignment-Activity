[theme]
base = "light"
primaryColor = "#2a63d6"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F6F7F9"
codeBackgroundColor = "#F2F3F5"
textColor = "#0F172A"
linkColor = "#2a63d6"
borderColor = "#E3E5EA"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "8px"
buttonRadius = "8px"
font = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
headingFontWeights = [700, 650, 600, 600, 600, 600]
blueColor = "#2a78d6"
greenColor = "#1baf7a"
orangeColor = "#eb6834"
redColor = "#e34948"
yellowColor = "#eda100"
violetColor = "#6250d6"
dataframeHeaderBackgroundColor = "#F6F7F9"

[theme.sidebar]
backgroundColor = "#F6F7F9"
secondaryBackgroundColor = "#ECEEF2"

[server]
headless = true
runOnSave = true

[browser]
gatherUsageStats = false
